<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Shosta Bazar BD</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <!-- Font Awesome CDN for Eye Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <svg width="48" height="48" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#320e17" stroke="#c8a24a" stroke-width="2"/><text x="32" y="40" text-anchor="middle" font-family="serif" font-style="italic" font-size="23" fill="#e6cd93">SB</text></svg>
        <h1>Shosta Bazar BD</h1>
        <p style="font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: #777;">Control Panel Portal</p>
      </div>

      <!-- AUTHENTICATION ERROR MESSAGE UI -->
      <div id="authError" style="display:none; color:#721c24; background:#f8d7da; border:1px solid #f5c6cb; padding:10px; border-radius:4px; font-size:0.8rem; margin-bottom:16px;"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <div style="position:relative; display:flex; align-items:center;">
            <input type="password" id="adminPassword" class="form-control" placeholder="Enter password" autocomplete="off" required>
            <i class="fa-solid fa-eye" id="togglePassword" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color:#777; z-index:10;"></i>
          </div>
        </div>
        <div class="form-group" style="display:flex; justify-content:space-between; align-items:center;">
          <label style="font-weight:normal; margin:0;"><input type="checkbox"> Remember me</label>
          <a href="#" style="font-size:0.75rem; color:var(--admin-gold-600);" onclick="alert('Admin Credentials: admin00 / admin001')">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-admin" style="width:100%; margin-top:10px; padding:12px;">Login to Admin</button>
      </form>
    </div>
  </div>

  <script>
      const API_BASE = 'https://shosta-bazar-bd.onrender.com/api';
    console.log('🔗 API_BASE:', API_BASE);
    // Password Toggle Functionality
    const togglePassword = document.getElementById('togglePassword');
    const adminPassword = document.getElementById('adminPassword');

    if (togglePassword && adminPassword) {
      togglePassword.addEventListener('click', function () {
        const isPassword = adminPassword.type === 'password';
        adminPassword.type = isPassword ? 'text' : 'password';
        
        // Toggle eye and eye-slash icons
        this.classList.toggle('fa-eye', !isPassword);
        this.classList.toggle('fa-eye-slash', isPassword);
      });
    }

    // Credential Verification Form Submission
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('adminPassword').value.trim();
      const authError = document.getElementById('authError');

      // Verify explicit admin credentials
      if (userVal === 'admin00' && passVal === 'admin001') {
        authError.style.display = 'none';
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.href = 'dashboard.html';
      } else {
        authError.textContent = 'Invalid username or password. Please try again.';
        authError.style.display = 'block';
      }
    });
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
