<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product | Shosta Bazar BD Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header"><b>Shosta Bazar Admin</b></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li class="active"><a href="products.html">Products</a></li>
        <li><a href="categories.html">Categories</a></li>
        <li><a href="hero.html">Hero Slider</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="customers.html">Customers</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="offers.html">Offers</a></li>
        <li><a href="content.html">Website Content</a></li>
        <li><a href="image-history.html">Image History</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
      <div class="sidebar-footer">
        <ul class="sidebar-menu">
          <li><a href="profile.html">Admin Profile</a></li>
          <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-navbar">
        <h2>Add New Product</h2>
        <a href="products.html" class="btn-admin-secondary">Back to Products</a>
      </header>

      <main class="content-body">
        <div class="card" style="max-width:700px; margin:0 auto;">
          <form id="addProductForm">
            <div class="form-group">
              <label for="productName">Product Name</label>
              <input type="text" id="productName" class="form-control" placeholder="Enter product name" required>
            </div>
            
            <div class="form-group">
              <label for="productCategory">Category</label>
              <select id="productCategory" class="form-control">
                <option value="Sarees">Sarees</option>
                <option value="Lehenga">Lehenga</option>
                <option value="Gowns">Gowns</option>
                <option value="Salwar Kameez">Salwar Kameez</option>
                <option value="Bridal">Bridal</option>
                <option value="Accessories">Accessories</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="productPrice">Price (BDT)</label>
              <input type="number" id="productPrice" class="form-control" placeholder="e.g. 6837" required>
            </div>
            
            <div class="form-group">
              <label for="productOldPrice">Old Price (BDT)</label>
              <input type="number" id="productOldPrice" class="form-control" placeholder="e.g. 893">
            </div>
            
            <div class="form-group">
              <label for="productImage">Image URL</label>
              <input type="text" id="productImage" class="form-control" placeholder="https://example.com/image.jpg">
            </div>

            <div class="form-group">
              <label for="productTag">Product Tag</label>
              <select id="productTag" class="form-control">
                <option value="">None</option>
                <option value="New">New</option>
                <option value="Sale">Sale</option>
                <option value="Featured">Featured</option>
                <option value="Bridal">Bridal</option>
              </select>
            </div>

            <div class="form-group">
              <label for="productDescription">Description</label>
              <textarea id="productDescription" class="form-control" rows="3" placeholder="Enter product details"></textarea>
            </div>

            <div class="form-group">
              <label for="productImageInput">Upload Image File (Optional)</label>
              <input type="file" id="productImageInput" class="form-control" accept="image/*">
              <div style="margin-top:10px;">
                <img id="imagePreview" style="max-width:120px; border-radius:4px; display:none;" src="" alt="Preview">
                <div id="imageFileInfo" style="font-size:0.75rem; color:#666; margin-top:4px;"></div>
              </div>
            </div>

            <button type="submit" class="btn-admin" style="margin-top:10px;">Save Product</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/api.js"></script>

  <script>
    // Live Image URL Preview Logic
    const imageUrlInput = document.getElementById('productImage');
    const imageFileInput = document.getElementById('productImageInput');
    const preview = document.getElementById('imagePreview');

    if (imageUrlInput) {
      imageUrlInput.addEventListener('input', (e) => {
        const url = e.target.value.trim();
        if (url) {
          preview.src = url;
          preview.style.display = 'block';
        } else {
          preview.style.display = 'none';
        }
      });
    }

    if (imageFileInput) {
      imageFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            preview.src = event.target.result;
            preview.style.display = 'block';
            // Save base64 string directly to image URL field
            if (imageUrlInput) imageUrlInput.value = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });
    }
  </script>
</body>
</html>
