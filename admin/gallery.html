<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery | Shosta Bazar BD Admin</title>

  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header"><b>Shosta Bazar Admin</b></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="categories.html">Categories</a></li>
        <li><a href="hero.html">Hero Slider</a></li>
        <li class="active"><a href="gallery.html">Gallery</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="customers.html">Customers</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="offers.html">Offers</a></li>
        <li><a href="content.html">Website Content</a></li>
        <li><a href="image-history.html">Image History</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
      <div class="sidebar-footer">
        <ul class="sidebar-menu">
          <li><a href="profile.html">Admin Profile</a></li>
          <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-navbar">
        <h2>Gallery Items</h2>
        <button class="btn-admin" onclick="showToast('Upload Gallery Image')">+ Add Image</button>
      </header>

      <main class="content-body">
        <div id="galleryGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:20px;"></div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-container">
      <h3>Confirm Delete</h3>
      <p id="modalMessage">Are you sure?</p>
      <div class="modal-footer">
        <button class="btn-admin-secondary" id="modalCancelBtn">Cancel</button>
        <button class="btn-admin" id="modalConfirmBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/gallery.js"></script>
<script src="js/api.js"></script>
<!-- Properly Positioned Upload Gallery Modal -->
<div id="galleryModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); z-index: 99999; justify-content: center; align-items: center;">
  <div style="background: #ffffff; padding: 24px; border-radius: 8px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="margin: 0; color: #320e17; font-family: serif;">Upload Gallery Image</h3>
      <span id="closeGalleryModal" style="cursor: pointer; font-size: 20px; font-weight: bold; color: #888;">&times;</span>
    </div>

    <form id="uploadGalleryForm">
      <div style="margin-bottom: 15px;">
        <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 5px; color: #333;">Image Title (Optional)</label>
        <input type="text" id="galleryTitle" placeholder="e.g. Wedding Silk Saree" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 5px; color: #333;">Paste Image URL</label>
        <input type="url" id="galleryImageUrl" placeholder="https://example.com/image.jpg" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" id="cancelGalleryModal" style="padding: 10px 18px; background: #eee; color: #333; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
        <button type="submit" style="padding: 10px 18px; background: #320e17; color: #e6cd93; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">Upload Gallery Image</button>
      </div>
    </form>

  </div>
</div>
</body>
</html>
