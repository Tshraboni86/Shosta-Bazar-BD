<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Profile | Shosta Bazar BD Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header"><b>Shosta Bazar Admin</b></div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="categories.html">Categories</a></li>
        <li><a href="hero.html">Hero Slider</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="customers.html">Customers</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="offers.html">Offers</a></li>
        <li><a href="content.html">Website Content</a></li>
        <li><a href="image-history.html">Image History</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
      <div class="sidebar-footer">
        <ul class="sidebar-menu">
          <li class="active"><a href="profile.html">Admin Profile</a></li>
          <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-navbar">
        <h2>Admin Profile</h2>
      </header>

      <main class="content-body">
        <div class="card" style="max-width:600px;">
          <form onsubmit="event.preventDefault(); showToast('Profile details updated');">
            <div class="form-group">
              <label>Name</label>
              <input type="text" class="form-control" value="Store Owner">
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" class="form-control" value="admin@shostabazarbd.com">
            </div>
            <div class="form-group">
              <label>Role</label>
              <input type="text" class="form-control" value="Super Administrator" disabled>
            </div>
            <hr style="margin:20px 0; border:none; border-top:1px solid var(--admin-border);">
            <div class="form-group">
              <label>New Password</label>
              <input type="password" class="form-control" placeholder="Leave blank to keep unchanged">
            </div>
            <button type="submit" class="btn-admin">Save Profile Changes</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
