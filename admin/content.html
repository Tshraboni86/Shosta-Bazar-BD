    <aside class="admin-sidebar">
      <div class="sidebar-header"><b>Shosta Bazar Admin</b></div>

        <li><a href="dashboard.html">Dashboard</a></li>

    <div class="admin-main">
      <header class="admin-navbar">
        <h2>Content Editor</h2>
      </header>

      <main class="content-body">
        <div class="card" style="max-width:700px;">
          <h3>Bridal Section Copy</h3>
          <form onsubmit="event.preventDefault(); showToast('Content updated');" style="margin-top:15px;">
            <div class="form-group">
              <label>Heading</label>
              <input type="text" class="form-control" value="Dive into luxury with our exclusive bridal collection">
            </div>
            <div class="form-group">
              <label>Description Paragraph</label>
              <textarea class="form-control" rows="4">A symphony of hand-embroidered sequins, mirror work, and rich fabric — each lehenga and saree designed to be the centrepiece of your grandest day.</textarea>
            </div>
            <button type="submit" class="btn-admin">Save Section Copy</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
